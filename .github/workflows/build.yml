name: Build and push

# On every push to main: run the checks against a PostgreSQL service,
# with the Elixir, Erlang/OTP and PostgreSQL versions from .tool-versions,
# build the Docker image, and push it to Amazon ECR. The push authenticates
# through GitHub OIDC by assuming the role in the AWS_ROLE_ARN repository
# variable; there are no long-lived keys. Without AWS_ROLE_ARN the image is
# built and not pushed, so the checks run anywhere.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  # .tool-versions states the toolchain. A service container starts before
  # any step runs, so this job reads the PostgreSQL major for it.
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.read.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read PostgreSQL major from .tool-versions
        run: |
          postgres=$(awk '$1 == "postgres" { print $2 }' .tool-versions)
          if [[ ! "$postgres" =~ ^[0-9]+$ ]]; then
            echo "::error file=.tool-versions::Add a 'postgres <major>' line naming the PostgreSQL major version."
            exit 1
          fi
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"

  quality:
    needs: toolchain
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:${{ needs.toolchain.outputs.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Restore Dialyzer PLTs
        id: plt-cache
        uses: actions/cache/restore@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - name: Dependency upgrade visibility
        run: mix hex.outdated --all
        continue-on-error: true
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix deps.unlock --check-unused
      - name: Tests with coverage
        if: ${{ !cancelled() }}
        run: mix test --cover
      - name: Strict Credo
        if: ${{ !cancelled() }}
        run: mix credo --strict
      - name: Dialyzer
        id: dialyzer
        if: ${{ !cancelled() }}
        run: mix dialyzer
      - name: Save Dialyzer PLTs
        if: ${{ !cancelled() && steps.plt-cache.outputs.cache-hit != 'true' && steps.dialyzer.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}
      - name: Dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: mix deps.audit
      - name: Retired packages
        if: ${{ !cancelled() }}
        run: mix hex.audit
      - name: Phoenix security
        if: ${{ !cancelled() }}
        run: mix sobelow --config
      - name: Documentation
        if: ${{ !cancelled() }}
        run: mix docs --warnings-as-errors

  build-and-push:
    permissions:
      contents: read
      id-token: write
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker buildx build --platform linux/arm64 --load -t shop:${{ github.sha }} .

      - name: Skip push (no AWS_ROLE_ARN)
        if: vars.AWS_ROLE_ARN == ''
        run: |
          echo "Image built and not pushed: the AWS_ROLE_ARN repository variable is not set." >> "$GITHUB_STEP_SUMMARY"
          echo "Set AWS_ROLE_ARN (an IAM role GitHub may assume through OIDC) and ECR_REPOSITORY to push to Amazon ECR." >> "$GITHUB_STEP_SUMMARY"

      - name: Check ECR_REPOSITORY
        if: vars.AWS_ROLE_ARN != '' && vars.ECR_REPOSITORY == ''
        run: |
          echo "::error::AWS_ROLE_ARN is set but ECR_REPOSITORY is not; set it to the name of the ECR repository to push to."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: vars.AWS_ROLE_ARN != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          for tag in "${{ github.sha }}"; do
            existing=$(aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids "imageTag=$tag" --query 'images[0].imageId.imageDigest' --output text)
            if [[ "$existing" != "None" && -n "$existing" ]]; then
              echo "Reusing immutable image $REGISTRY/$REPOSITORY@$existing" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            docker tag "shop:${{ github.sha }}" "$REGISTRY/$REPOSITORY:$tag"
            docker push "$REGISTRY/$REPOSITORY:$tag"
            echo "Pushed $REGISTRY/$REPOSITORY:$tag" >> "$GITHUB_STEP_SUMMARY"
          done
