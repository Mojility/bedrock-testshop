jobs:
  # .tool-versions states the toolchain. A service container starts before
  # any step runs, so this job reads the PostgreSQL major for it.
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.read.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read PostgreSQL major from .tool-versions
        run: |
          postgres=$(awk '$1 == "postgres" { print $2 }' .tool-versions)
          if [[ ! "$postgres" =~ ^[0-9]+$ ]]; then
            echo "::error file=.tool-versions::Add a 'postgres <major>' line naming the PostgreSQL major version."
            exit 1
          fi
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"

  quality:
    needs: toolchain
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:${{ needs.toolchain.outputs.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: business_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Restore Dialyzer PLTs
        id: plt-cache
        uses: actions/cache/restore@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - name: Dependency upgrade visibility
        run: mix hex.outdated --all
        continue-on-error: true
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix deps.unlock --check-unused
      - name: Tests with coverage
        if: ${{ !cancelled() }}
        run: mix test --cover
      - name: Strict Credo
        if: ${{ !cancelled() }}
        run: mix credo --strict
      - name: Dialyzer
        id: dialyzer
        if: ${{ !cancelled() }}
        run: mix dialyzer
      - name: Save Dialyzer PLTs
        if: ${{ !cancelled() && steps.plt-cache.outputs.cache-hit != 'true' && steps.dialyzer.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}
      - name: Dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: mix deps.audit
      - name: Retired packages
        if: ${{ !cancelled() }}
        run: mix hex.audit
      - name: Phoenix security
        if: ${{ !cancelled() }}
        run: mix sobelow --config
      - name: Documentation
        if: ${{ !cancelled() }}
        run: mix docs --warnings-as-errors

  release-acceptance:
    needs: toolchain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ needs.toolchain.outputs.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-release-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
      - name: Runtime v1 release and HTTP/database smoke
        run: python3 scripts/qualify_release.py
      - name: Preserve release boundary logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-logs
          path: ~/.foundry/tool-logs/release-*.log

